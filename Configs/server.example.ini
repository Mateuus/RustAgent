; ============================================================
;  server.example.ini  -  MODELO de configuracao de UM servidor
;
;  ESTE ARQUIVO E UM MODELO, versionado no git. Nao edite este:
;  ele e a fonte de onde cada servidor novo nasce.
;
;  ------------------------------------------------------------
;  UM ARQUIVO POR SERVIDOR, E O NOME E O ID
;
;      Configs\pvp1.ini  ->  Servers\pvp1\  Logs\pvp1\  Backups\pvp1\
;      Configs\pve.ini   ->  Servers\pve\   Logs\pve\   Backups\pve\
;
;  Quem cria estes arquivos e o PAINEL (POST /api/servers): ele
;  copia este modelo, troca os valores informados no formulario e
;  escolhe um bloco de portas livre. Criar a mao tambem funciona -
;  o agente descobre o arquivo no proximo boot.
;
;  O id so pode ter minusculas, digitos e hifen: ele vira nome de
;  pasta, e o Windows nao distingue Pvp1\ de pvp1\.
;
;  ####  AS QUATRO PORTAS ANDAM JUNTAS  ####
;
;  Um servidor abre QUATRO portas (jogo, query, RCON e companion),
;  e os blocos sao espacados de 100:
;
;      bloco 0    28015  28016  28017  28082    <- este modelo
;      bloco 1    28115  28116  28117  28182
;      bloco 2    28215  28216  28217  28282
;
;  Repetir uma porta NAO da erro na tela: o segundo servidor sobe,
;  carrega o mundo inteiro e fica sem aparecer na lista da Steam
;  (ou sem aceitar RCON), sem nada explicando por que. O agente
;  recusa cadastrar duas vezes a mesma porta, e recusa iniciar
;  quando a porta ja esta ocupada na maquina.
;
;  ------------------------------------------------------------
;  SINTAXE
;
;    CHAVE=valor          sem espacos ao redor do "="
;    ; comentario         apenas no inicio da linha
;    [Secao]              decorativa; as chaves sao globais,
;                         por isso todas tem prefixo unico
;
;  Valores NAO levam aspas. Escreva:
;      SERVER_HOSTNAME=Meu Servidor
;  e nao:
;      SERVER_HOSTNAME="Meu Servidor"
; ============================================================


[Server]

; Como o PAINEL chama este servidor.
;
; ####  ELE NAO E O SERVER_HOSTNAME  ####
;
;     SERVER_NAME      o rotulo curto do painel ("PVP 1")
;     SERVER_HOSTNAME  o que o jogador ve na lista do jogo
;                      ("OrigemZ PvP | X5 | Wipe na quinta")
SERVER_NAME=Servidor Rust

; Nome que aparece na lista de servidores DO JOGO.
SERVER_HOSTNAME=Servidor Rust

; Pasta de saves e config, dentro da instalacao:
;     Servers\<id>\server\<identity>\
;
; Trocar a identity = mundo novo, sem apagar o antigo.
SERVER_IDENTITY=servidor

; Descricao mostrada no menu do servidor.
SERVER_DESCRIPTION=

; Opcionais. Deixe vazio para nao enviar o parametro ao jogo.
SERVER_URL=
SERVER_HEADERIMAGE=

; Mapa. "Procedural Map" gera a partir do seed.
; Outras opcoes: Barren, HapisIsland, Craggy Island.
;
; DICA: para testar, "Craggy Island" carrega em segundos, contra
; minutos de um mapa procedural.
SERVER_LEVEL=Procedural Map

; Seed do mapa: 0 a 2147483647.
; Mesmo seed + mesmo worldsize = exatamente o mesmo mapa.
SERVER_SEED=12345

; Tamanho do mundo: 1000 a 6000.
; Menor = geracao e boot muito mais rapidos.
SERVER_WORLDSIZE=3000

SERVER_MAXPLAYERS=100

; Intervalo do save automatico, em segundos.
;
; E o que se perde num "parar a forca": tudo desde o ultimo save.
SERVER_SAVEINTERVAL=300

; 0 = o agente IGNORA este servidor: nao cuida, nao vigia, e deixa
; as portas dele fora da conferencia de conflitos.
;
; Um servidor criado pelo painel nasce com 0, porque o jogo sao
; dezenas de GB que ainda nao estao em disco no instante do
; clique. Ligar e o passo DEPOIS de instalar:
;
;     PATCH /api/servers/<id> {"enabled":true}
;
; O painel faz isso na tela de Servidores, e o agente sobe o RCON
; na hora e reescreve esta linha - sem reiniciar nada.
;
; Repare: LIGADO nao quer dizer NO AR. Ligado = o agente cuida
; deste servidor. Subir o jogo e a operacao server-start.
SERVER_ENABLED=0

; 1 = o jogo sobe numa JANELA DE CONSOLE propria, como quando se
; rodava o .bat a mao. Util para quem administra a maquina de
; perto: o processo aparece na barra de tarefas e da para
; acompanha-lo sem o painel.
;
; ####  O CLIQUE QUE CONGELA O SERVIDOR  ####
;
; O console do Windows vem com o "Modo de Edicao Rapida" ligado.
; Um clique dentro da janela poe o console em modo de SELECAO, e a
; partir dai toda escrita fica BLOQUEADA: o RustDedicated continua
; tentando imprimir, o buffer enche, e o processo inteiro PARA -
; com os jogadores dentro. Ele volta a andar quando alguem aperta
; Enter na janela.
;
; Por isso o padrao e 0 num servico 24/7. Ligue quando quiser
; olhar o servidor de perto, e evite clicar dentro da janela.
;
; A mudanca vale no PROXIMO start: uma janela nao aparece para um
; processo que ja esta no ar.
SERVER_CONSOLE_WINDOW=0


[Network]

; ############################################################
; #  MUDE AS QUATRO DE UMA VEZ, para o proximo bloco livre.  #
; #  Ver o cabecalho deste arquivo.                          #
; ############################################################

; Porta do jogo (UDP).
SERVER_PORT=28015

; Porta de query/Steam (UDP).
; PRECISA ser diferente de SERVER_PORT. Se nao for informada, o
; Rust usa 1 + max(server.port, rcon.port).
SERVER_QUERYPORT=28017

; Porta do companion, o Rust+ (TCP). E o "app.port" do jogo.
;
; Vazio = o padrao do Rust, que e 28082. Com mais de um servidor
; na maquina isso deixa de servir: os dois tentariam 28082, e o
; companion do segundo ficaria mudo sem nenhum erro visivel.
SERVER_APPPORT=28082


[RCON]

; ############################################################
; #  !!! TROQUE ESTA SENHA !!!                               #
; #                                                          #
; #  Com RCON_WEB=1, quem tem esta senha executa QUALQUER     #
; #  comando neste servidor. O painel gera uma aleatoria ao   #
; #  criar o servidor; o valor abaixo e so o do modelo.       #
; ############################################################
RCON_PASSWORD=TROQUE_ESTA_SENHA

; Porta do RCON (TCP).
RCON_PORT=28016

; 1 = RCON via WebSocket. E o que o agente fala; o RCON binario
; antigo NAO serve, e o agente recusa cuidar de um servidor com 0.
RCON_WEB=1

; Host usado pelo agente para se conectar. Como o agente roda na
; mesma maquina do servidor, e sempre 127.0.0.1.
RCON_HOST=127.0.0.1


[SteamCMD]

; AppID do RUST DEDICATED SERVER (nao e o AppID do jogo).
STEAM_APPID=258550

; Servidor dedicado do Rust e gratuito: login anonimo.
STEAM_LOGIN=anonymous

; Branch do Steam. Vazio = publica (o que voce quer).
;   staging:  STEAM_BRANCH=-beta staging
;   voltar:   STEAM_BRANCH=-beta public
;
; O agente le esta chave para duas coisas: instalar/atualizar
; (+app_update) e perguntar o buildid publicado do BRANCH certo.
STEAM_BRANCH=
